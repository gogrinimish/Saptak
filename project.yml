name: Saptak
options:
  bundleIdPrefix: com.playsaptak
settings:
  base:
    SWIFT_VERSION: 5.9
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 10
    INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
    INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    INFOPLIST_KEY_CFBundleDisplayName: Saptak
    INFOPLIST_KEY_CFBundleName: Saptak
    PRODUCT_BUNDLE_IDENTIFIER: com.playsaptak.app
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  Saptak:
    productName: Saptak
    type: application
    platform: iOS
    configFiles:
      Debug: Config/LocalSigning.xcconfig
      Release: Config/LocalSigning.xcconfig
    sources:
      - path: App
        excludes: [Fonts]
      - path: App/Fonts
        type: folder
        buildPhase: resources
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Fonts/Alice-Regular.ttf]
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: SaptakCore
    settings:
      base:
        PRODUCT_NAME: Saptak
        # macOS has a dedicated native target; avoid the signing-dependent iPad-on-Mac route.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  SaptakMac:
    productName: Saptak
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Fonts]
      - path: App/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SaptakCore
    settings:
      base:
        PRODUCT_NAME: Saptak
        CODE_SIGN_ENTITLEMENTS: App/SaptakMac.entitlements
packages:
  SaptakCore:
    path: .

schemes:
  SaptakMac:
    build:
      targets:
        SaptakMac: all
    management:
      shared: true
      orderHint: 0
  Saptak-iOS:
    build:
      targets:
        Saptak: all
    management:
      shared: true
      orderHint: 1
